# The translation core shares WhiskyBridge's relaxed metrics: provider adapters
# and request lifecycle handlers read as one flat function per protocol.
opt_in_rules:
  - file_header

disabled_rules:
  - nesting
  - force_unwrapping
  - optional_data_string_conversion

excluded:
  - .build

function_body_length:
  warning: 120
  error: 200
cyclomatic_complexity:
  warning: 25
  error: 35
function_parameter_count:
  warning: 8
  error: 12
large_tuple:
  warning: 3
  error: 4
line_length:
  warning: 160
  error: 250
