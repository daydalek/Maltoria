name: Native LunaHook builds

on:
  push:
    tags: ['v*', 'app-v*', 'vn-v*', 'linux-v*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  XWIN_VERSION: '0.10.0'

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cross-compilation toolchain
        run: |
          # xwin's MSVC STL headers require clang >=19; Ubuntu 24.04 ships 18.
          wget -q https://apt.llvm.org/llvm-snapshot.gpg.key -O- | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 lld-19 llvm-19 ninja-build cmake mono-mcs
      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache xwin binary and Windows SDK/CRT sysroot
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/xwin
            ~/.cache/maltoria-xwin
          key: xwin-${{ env.XWIN_VERSION }}-x86-x86_64-v1
      - name: Install xwin if not cached
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/xwin" ]; then
            curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
              | tar -xz --strip-components=1 -C "$HOME/.local/bin" "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl/xwin"
            chmod +x "$HOME/.local/bin/xwin"
          fi
      - name: Build pinned upstream sources and capture helper
        run: |
          python3 scripts/build-lunahook.py \
            --architecture "${{ matrix.arch }}" \
            --output "$RUNNER_TEMP/MaltoriaNative" \
            --xwin-dir "$HOME/.cache/maltoria-xwin" \
            --accept-xwin-license
      - name: Verify PE architectures of built outputs
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import os

          spec = importlib.util.spec_from_file_location('stage', 'scripts/stage-lunahook-payload.py')
          stage = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(stage)

          arch = '${{ matrix.arch }}'
          payload = Path(os.environ['RUNNER_TEMP']) / 'MaltoriaNative' / arch
          for name in stage.expected_files(arch) + ('MaltoriaUnicodeFixture.exe',):
              path = payload / name
              assert path.is_file(), f'Missing {path}'
              machine = stage.pe_machine(path)
              assert stage.machine_allowed(arch, name, machine), f'PE machine mismatch for {name}: {hex(machine)}'
          print(f'Verified PE headers for {arch} payload in {payload}')
          PY
      - name: Assemble source and compliance payload
        run: |
          python3 scripts/check-third-party.py
          python3 scripts/package-native-sources.py --output "$RUNNER_TEMP/MaltoriaNative/sources"
      - uses: actions/upload-artifact@v4
        with:
          name: Maltoria-LunaHook-${{ matrix.arch }}
          path: ${{ runner.temp }}/MaltoriaNative
          if-no-files-found: error
          retention-days: 7
