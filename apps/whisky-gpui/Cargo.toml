[package]
name = "whisky-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["gpui-fast"] }
chrono = "=0.4.45"
image = "=0.25.10"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
smol = "=2.0.2"
whisky-bridge = { path = "../../crates/whisky-bridge" }
uuid = { version = "=1.28.0", features = ["v4"] }
ureq = { version = "=3.5.2", features = ["json"] }

[build-dependencies]
toml = "=1.1.8"

# macOS cover upscaling uses Metal; Linux uses the bundled ncnn helper.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"
x11rb = { version = "=0.13.2", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"

[features]
visual-test = ["gpui-kit/test-support"]

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
backtrace = "=0.3.76"
